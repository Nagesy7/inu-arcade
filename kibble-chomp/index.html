<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="stage"><canvas id="screen" width="384" height="216" aria-label="Inu Arcade game screen"></canvas></div>
<div id="bar">
  <button class="tb" id="b-lobby" title="Back to the arcade hall">⌂ Hall</button>
  <button class="tb" id="b-scores" title="Leaderboards">🏆 Scores</button>
  <button class="tb" id="b-prizes" title="Prize counter">🎟 Prizes</button>
  <button class="tb" id="b-profile" title="Your Shiba">🐕 Me</button>
  <button class="tb" id="b-mute" title="Sound">🔊</button>
  <span id="purse"></span>
</div>
<div id="pad" aria-hidden="true">
  <div class="dpad"><b data-k="up">▲</b><b data-k="left">◀</b><b data-k="right">▶</b><b data-k="down">▼</b></div>
  <div class="btns"><b data-k="a" class="abtn">A</b><b data-k="start" class="sbtn">START</b><b data-k="back" class="sbtn bk">BACK</b></div>
</div>
<div id="panel" hidden><div class="pbox"><button class="x" id="pclose" aria-label="Close">✕</button><div id="pbody"></div></div></div>
<div id="rotate"><div>🐕📱↻<br>Turn your phone sideways to play</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
