<script type="importmap">{"imports":{"@solana/web3.js":"https://esm.sh/@solana/web3.js@1.98.4"}}</script>

<link rel="preload" href="/fonts/PressStart2P.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/style.css">
<!-- Vercel Web Analytics + Speed Insights (cookieless, no personal data) -->

<body>
<div id="app">
<div id="gbc" role="group" aria-label="Inu Arcade handheld">
  <div class="gbc-bezel">
    <div class="gbc-strip"><i class="gbc-led" title="Power"></i><span>SHIBA PIXEL SCREEN</span></div>
    <div id="stage"><div id="crtwrap"><canvas id="screen" width="384" height="216" aria-label="Inu Arcade game screen"></canvas></div></div>
  </div>
  <div class="gbc-logo" aria-hidden="true"><b>INU</b> <span class="rb"><i>A</i><i>R</i><i>C</i><i>A</i><i>D</i><i>E</i></span></div>
  <div id="pad" aria-hidden="true">
    <div class="dpad"><i class="dx"></i><b data-k="up">▲</b><b data-k="left">◀</b><b data-k="right">▶</b><b data-k="down">▼</b></div>
    <div class="btns"><b data-k="b" class="bbtn">B</b><b data-k="a" class="abtn">A</b><b data-k="c" class="cbtn">C</b></div>
    <div class="pills"><b data-k="back" class="sbtn bk"><u></u>SELECT</b><b data-k="start" class="sbtn st"><u></u>START</b></div>
  </div>
  <div class="gbc-grille" aria-hidden="true"></div>
</div>
<div id="bar">
  <button class="tb" id="b-lobby" title="Back to the arcade hall">⌂<span class="lbl"> Hall</span></button>
  <button class="tb" id="b-scores" title="Leaderboards">🏆<span class="lbl"> Scores</span></button>
  <button class="tb" id="b-prizes" title="Prize counter">🎟<span class="lbl"> Prizes</span></button>
  <button class="tb" id="b-profile" title="Your Shiba">🐕<span class="lbl"> Me</span></button>
  <button class="tb" id="b-ach" title="Achievements">🏅</button>
  <button class="tb" id="b-crt" title="CRT / bloom">📺</button>
  <button class="tb" id="b-mute" title="Sound">🔊</button>
  <span id="purse"></span>
</div>
</div>
<div id="panel" hidden><div class="pbox"><button class="x" id="pclose" aria-label="Close">✕</button><div id="pbody"></div></div></div>
<div id="rotate"><div><span class="rot-ico">📱↺</span><br>Rotate your phone upright<br>to play Inu Arcade</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
